[project]
name = "diligence_agent"
version = "0.1.0"
description = "Flow-based diligence agent using CrewAI for automated investment analysis"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools[mcp]>=0.62.0",
    "crewai[tools]>=0.159.0,<1.0.0",
    "opik>=1.8.27",
    "requests>=2.32.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "gradio>=4.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=0.5.0",
    "google-api-python-client>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ui = "diligence_agent.ui:launch_ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "asyncio: marks tests as async tests",
]
asyncio_mode = "auto"
